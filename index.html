<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8ed1ea">
<meta name="description" content="A tiny pixel-art dance party: Claude, a t-rex, a train, a truck, a cat, a mysterious egg, and a triceratops. Tap for fireworks.">
<meta property="og:title" content="claude --dance">
<meta property="og:description" content="Pixel dance party. Tap for fireworks. Watch the egg.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕺</text></svg>">
<title>claude --dance</title>
<style>
  :root {
    --sky: #8ed1ea;
    --ink: #2b4a58;
    --dim: #3b6478;
    --accent: #d97757;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    overflow: hidden;
    overscroll-behavior: none;
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    color: var(--dim);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    height: 100dvh;   /* mobile browsers: track the real visible height as the address bar hides/shows */
    image-rendering: pixelated;
    cursor: pointer;
    touch-action: none;   /* taps go to the party, not to scrolling or pinch-zoom */
  }
  .hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(16px, 3vmin, 32px);
    padding-top: max(clamp(16px, 3vmin, 32px), env(safe-area-inset-top));
    padding-bottom: max(clamp(16px, 3vmin, 32px), env(safe-area-inset-bottom));
    padding-left: max(clamp(16px, 3vmin, 32px), env(safe-area-inset-left));
    padding-right: max(clamp(16px, 3vmin, 32px), env(safe-area-inset-right));
  }
  .prompt {
    font-size: clamp(13px, 1.8vmin, 16px);
    letter-spacing: 0.08em;
  }
  .prompt .dollar { color: var(--accent); }
  .prompt .cmd { color: var(--ink); font-weight: 600; }
  .cursor {
    display: inline-block;
    width: 0.6em; height: 1.05em;
    background: var(--ink);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    pointer-events: auto;
  }
  button {
    font: inherit;
    font-size: clamp(11px, 1.6vmin, 14px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--ink);
    padding: 8px 16px;
    min-height: 40px;   /* comfortable touch target */
    cursor: pointer;
    touch-action: manipulation;   /* kill the double-tap zoom delay on remix mashing */
    transition: background 0.15s, color 0.15s;
  }
  @media (max-width: 640px) {
    button { padding: 7px 10px; letter-spacing: 0.08em; font-size: 11px; }
    .controls { gap: 6px 8px; }
    .prompt { font-size: 11px; word-break: break-all; }
  }
  button:hover { background: rgba(255, 255, 255, 0.85); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hint {
    font-size: clamp(10px, 1.5vmin, 13px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .verb-tap { display: none; }
  @media (hover: none) and (pointer: coarse) {
    .verb-tap { display: inline; }
    .verb-click { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud">
  <div class="prompt"><span class="dollar">$</span> <span class="cmd">claude --dance --with trex,train,truck,cat,egg --disco</span><span class="cursor"></span></div>
  <div class="controls">
    <button id="beatBtn" aria-pressed="false">&#9654; beat</button>
    <button id="houseBtn" aria-pressed="false">remix: house</button>
    <button id="trapBtn" aria-pressed="false">remix: trap</button>
    <button id="tranceBtn" aria-pressed="false">remix: trance</button>
    <button id="countryBtn" aria-pressed="false">remix: country</button>
    <button id="popBtn" aria-pressed="false">remix: 90s pop</button>
    <button id="shareBtn">share</button>
    <button id="snapBtn">postcard</button>
    <span class="hint"><span class="verb-click">click</span><span class="verb-tap">tap</span>: fireworks + mexican wave (watch the egg)</span>
  </div>
</div>

    ix.textAlign = 'center'; ix.textBaseline = 'middle';

  refreshPrompt();

  // ---- Confetti, steam, flips ----
  const confetti = [];
  let flipAt = -Infinity;
  function burst(cx, cy, colors, count) {
    colors = colors || CONFETTI_COLORS;
    count = count || 60;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 7;
      confetti.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 4,

  }
  // ---- Rhythm game: taps are judged against the beat grid while the beat runs ----
  let combo = 0, bestCombo = 0, comboFlashAt = -Infinity, comboJudge = '';
  function scoreTap(now) {
    if (!beatOn || reduced || !isFinite(lastKickAt)) return;

    const phase = ((((now - lastKickAt) % BEAT_MS) + BEAT_MS) % BEAT_MS) / BEAT_MS;   // 0 = right on the kick
    const onBeat = phase < 0.20 || phase > 0.80;

      comboJudge = phase < 0.09 || phase > 0.91 ? 'perfect' : 'nice';
      comboFlashAt = now;

      if (combo % 8 === 0) {
        for (let j = 0; j < DANCERS.length; j++) jumpV[j] = scale * (1.2 + Math.random() * 0.5);
        for (let b = 0; b < 5; b++) burst(W * (0.1 + 0.2 * b), H * 0.12, CONFETTI_COLORS, 30);
        orchHit(getAudio().currentTime);
        buzz([30, 40, 30]);
      }
    } else if (combo > 1) {
      comboJudge = 'miss';
      comboFlashAt = now;
      combo = 0;
    } else {
      combo = 0;
    }
  }

  // ---- Drag-to-conduct: grab a dancer, reorder the line, fling them skyward ----
  const jumpY = new Array(DANCERS.length).fill(0);   // current hop height, px
  const jumpV = new Array(DANCERS.length).fill(0);   // upward velocity, px/frame
  const dancerPos = new Array(DANCERS.length).fill(null);   // screen bboxes, updated each frame
  let drag = null;

  function doStageTap(cx, cy) {
    const now = performance.now();
    burst(cx, cy);
    fireworkSound();
    buzz(35);
    scoreTap(now);
    if (!reduced) {
      flipAt = now;
      if (eggStage === 'egg' && EGG_INDEX >= 0) {
        // Crack while the wave travels; hatch lands right as the egg's flip finishes
        eggStage = 'cracking';
        hatchDoneAt = now + EGG_INDEX * FLIP_STAGGER + FLIP_MS;
      }
    } else {
      if (eggStage === 'egg' && EGG_INDEX >= 0) {
        eggStage = 'baby';
        stageUntil = now + BABY_MS;

      }

    }
  }

  canvas.addEventListener('pointerdown', e => {
    armTilt();          // iOS wants a gesture before it hands over the gyroscope
    unlockAudio();      // and a gesture before sound escapes the silent switch
    startPendingBeat(); // URL asked for music: first touch is our autoplay permission
    // Grab check: did the finger land on somebody?
    let hit = -1, hitD = Infinity;

      for (let i = 0; i < DANCERS.length; i++) {

  });
  function endDrag(e) {

    } else if (drag.vy < -0.35) {

  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', () => { drag = null; });

  const steam = [];
  let lastSteamStep = -1;
  const trail = [];      // dragon sparkles + fire breath + embers
  let lastFlameAt = 0;
  let flameJet = null;   // active sustained fire-breath {ti, tx, ty, until}
  let flash = null;      // impact flash {x, y, start, dur}


  // ---- Render ----
  function drawScene(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;

    const beatIndex = Math.floor(danceMs / BEAT_MS);
    const floorY = H * 0.72;
    T = mode === 'trance' ? THEME_NEON
      : mode === 'house' ? THEME_GRUNGE
      : mode === 'trap' ? THEME_COURT
      : mode === 'country' ? THEME_DESERT
      : mode === 'pop' ? THEME_SCHOOL
      : chipTheme();

    // Egg lifecycle: cracking -> baby -> growing -> grown ??? -> egg again
    const eggD = DANCERS[EGG_INDEX];
    if (!eggD) { /* no egg in this lineup */ } else if (eggStage === 'cracking' && now >= hatchDoneAt) {
      eggStage = 'baby';
      stageUntil = now + BABY_MS;
      // Roll the hatch table NOW so the baby matches what's going to fly:
      // pink dragonling, yellow chick, or the rare golden hatchling
      hatchling = pickHatch(URLP.get('hatch'));
      burst(W * eggD.xFrac, floorY - eggD.h * scale * 0.5, SHELL_COLORS, 30);
      if (hatchling.kind === 'chicken') cluckSound(); else hatchSound();
    } else if (eggStage === 'baby' && now >= stageUntil) {
      if (reduced) {
        eggStage = 'egg';
      } else {
        eggStage = 'growing';
        growStart = now;
        growSound();
      }
    } else if (eggStage === 'growing' && now >= growStart + GROW_MS) {
      eggStage = 'dragon';
      dragonStart = now;
      stageUntil = now + DRAGON_MS;
      if (hatchling.kind === 'chicken') cluckSound(); else dragonSound();
      if (hatchling.kind === 'golden') burst(W * eggD.xFrac, floorY - 8 * scale, ['#f2c14e', '#f9e2a0', '#fdf6ec'], 50);
    } else if (eggStage === 'dragon' && now >= stageUntil) {
      eggStage = 'egg';
      burst(W * eggD.xFrac, floorY - 8 * scale, ['#fdf6ec', '#ffffff', '#e08fb6'], 26);
    }

    // Sky
    const sky = ctx.createLinearGradient(0, 0, 0, floorY);
    sky.addColorStop(0, T.skyTop);
    sky.addColorStop(1, T.skyBot);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, floorY);

    // Stars
    for (const s of STARS) {
      const tw = reduced ? 0.6 : 0.35 + 0.5 * (0.5 + 0.5 * Math.sin(now / 700 + s.p));
      drawStar(s.x * W - tiltX * scale * 3, s.y * floorY, Math.max(2, scale * 0.28), tw);
    }

    // Clouds — but not indoors (the warehouse and the school hall have roofs)
    if (mode !== 'house' && mode !== 'pop') {
      for (const c of CLOUDS) {
        const drift = reduced ? 0 : (now / 1000) * c.v;
        const cw = 120 * c.s;
        const cx = ((c.x + drift) % 1.2) * (W + cw * 2) - cw - tiltX * scale * 8 * c.s;
        drawCloud(cx, c.y * floorY, c.s * Math.min(W, 900) / 900 + 0.3);

    }

    // Floor — OutRun perspective grid in trance, pulsing checker everywhere else

    if (mode === 'trance' && !reduced) {
      // Streaking synthwave grid: the crew is DRIVING now

      const grd = ctx.createLinearGradient(0, floorY, 0, H);

      grd.addColorStop(1, '#241250');

      ctx.fillRect(0, floorY, W, gh);
      // Rails converging on the vanishing point

        ctx.moveTo(vx + m * scale * 0.9, floorY);
        ctx.lineTo(vx + m * W * 0.13, H);
        ctx.stroke();

      for (let k = 0; k < 12; k++) {
        const z = ((k + zoff) / 12) % 1;
        const y = floorY + gh * Math.pow(z, 2.2);
        ctx.strokeStyle = `rgba(255, 79, 216, ${0.25 + z * (waveActive ? 0.75 : 0.55)})`;

        ctx.moveTo(0, y);
        ctx.lineTo(W, y);

        const z = ((k / NB) + bzoff) % 1;
        const s = Math.pow(z, 2.2);

        const hVar = 0.7 + (((k * 53) % 5) / 5) * 0.6;

        const xoff = scale * 2 + W * 0.40 * s;
        ctx.globalAlpha = 0.25 + 0.75 * z;

          ctx.fillRect(bx, baseY - bh, bw, bh);

          ctx.fillStyle = glow;

          const edgeW = Math.max(2, s * scale * 0.35);

    } else {
      const tile = scale * 2.4;
      const cols = Math.ceil(W / tile) + 1;
      const rows = Math.ceil((H - floorY) / tile) + 1;

        for (let c = 0; c < cols; c++) {

          const lit = !reduced && ((c + r + beatIndex) % 5 === 0);

            ? (waveActive ? T.disco[(c * 3 + r + beatIndex) % T.disco.length] : T.tileLit)

      }
      // Court paint on the trap asphalt
      if (mode === 'trap') {

        ctx.lineWidth = Math.max(2, scale * 0.25);

      : showPhaseT < DROP_MS + PARTY_MS ? 'party'
      : showPhaseT < DROP_MS + PARTY_MS + SCOOP_MS ? 'scoop' : 'idle';

      const beatT = danceMs / BEAT_MS + (lineDance ? 0 : d.phase);
      const bounce = reduced ? 0 : Math.abs(Math.sin(beatT * Math.PI)) * scale * (lineDance ? 0.6 : 1.1);
      let tilt = reduced ? 0 : Math.sin(beatT * Math.PI) * 0.06;
      const halfStep = Math.floor(beatT * 2);
      let frameIdx = reduced ? 0 : DANCE_CYCLE[halfStep % DANCE_CYCLE.length];
      let x = W * d.xFrac;
      let pounce = 0;

        const gi = Math.floor(gb) % GRAPEVINE.length;
        const gf = gb % 1;

        if (show.k === 1 && !reduced) {

      if (d.isEgg) {

          frames = hatchling.frames; dw = hatchling.w; dh = hatchling.h;

      let hop = 0;
      const fp = (now - flipAt - i * FLIP_STAGGER) / FLIP_MS;
      if (fp >= 0 && fp <= 1) {

        hop = Math.sin(Math.PI * fp) * scale * 3;
      }

          x: x + (d.steamCol - d.w / 2) * scale * sizeF,
          y: flY - bounce - (d.h - 1) * scale * sizeF,
          r: scale * 0.9 * sizeF,
          vy: -0.8 - Math.random() * 0.5,
          life: 70,
        });
      }

      if (!reduced && (jumpV[i] > 0 || jumpY[i] > 0)) {

        if (jumpY[i] <= 0) { jumpY[i] = 0; jumpV[i] = 0; }

      const duckF = ducking ? 0.55 : 1;
      const lift = (ducking ? bounce * 0.15 : bounce + hop + pounce) + jumpY[i];
      const squash = Math.max(0.4, 1 - lift / (scale * 5));

      const ke = show.k * show.k * (3 - 2 * show.k);
      const gs = show.k >= 1 ? 1 : 0.35 + 0.65 * ke;
      const spriteW = dw * scale * sizeF * gs, spriteH = dh * scale * sizeF * duckF * gs;
      let px = x, py = flY - lift + scale - spriteH / 2;
      if (show.k < 1) {

        const homeY = py;
        px = bag.x + (x - bag.x) * ke;
        py = bag.y + (homeY - bag.y) * ke - Math.sin(ke * Math.PI) * scale * 4;
      }
      dancerPos[i] = { x: px, y: py, w: spriteW, h: spriteH };   // for grab hit-testing

      ctx.fillStyle = `rgba(${T.shadow}, ${0.25 * ke})`;
      ctx.beginPath();
      ctx.ellipse(x, flY + scale * 0.4, scale * shadowW * sizeF * squash, scale * 1.1 * squash, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ducking ? 0 : tilt);
      if (d.isCat) ctx.scale(catFacing, 1);
      ctx.drawImage(frames[frameIdx], -spriteW / 2, -spriteH / 2, spriteW, spriteH);
      if (lineDance) {
        const hw = 10 * scale * 0.75, hh = 5 * scale * 0.75;
        ctx.drawImage(hatSprite, d.hatX * scale * sizeF - hw / 2, -spriteH / 2 - hh + scale * 0.4, hw, hh);
        // Cowboy boots over whatever passes for feet (yes, even wheels)
        const bw = 4 * scale * 0.8, bh = 3 * scale * 0.8;
        [-1, 1].forEach(side => {
          ctx.drawImage(bootSprite, side * spriteW * 0.18 - bw / 2, spriteH / 2 - bh * 0.85, bw, bh);
        });
      }
      if (mode === 'trap') {
        const cw = 8 * scale * 0.7, ch = 5 * scale * 0.7;
        const [nx, ny] = d.chainPos;
        ctx.drawImage(chainSprite, nx * scale * sizeF - cw / 2, ny * scale * sizeF - ch * 0.2, cw, ch);
      }
      // 90s pop: cheer pom-poms, shaken on the beat
      if (mode === 'pop' && !reduced) {
        const shake = Math.sin(beatT * Math.PI * 2);
        const POM = ['#e0483a', '#ffffff', '#f2c14e'];
        [-1, 1].forEach(side => {
          const pxp = side * spriteW * 0.55;
          const pyp = -spriteH * 0.05 - Math.abs(shake) * scale * (side === 1 ? 1.2 : 0.8);
          for (let b = 0; b < 6; b++) {
            const ang = (b / 6) * Math.PI * 2 + shake * 0.5;
            ctx.fillStyle = POM[b % 3];
            ctx.beginPath();
            ctx.arc(pxp + Math.cos(ang) * scale * 0.55, pyp + Math.sin(ang) * scale * 0.55, scale * 0.45, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }
      // Glow sticks in the warehouse: one per paw/claw/bumper, waving on the beat
      if (mode === 'house' && !reduced) {
        const GLOW = ['#b6ff2e', '#00e5ff', '#ff4fd8'];
        const wave = Math.sin(beatT * Math.PI * 2);
        [-1, 1].forEach((side, si) => {
          const col = GLOW[(i + si) % GLOW.length];
          ctx.save();
          ctx.translate(side * spriteW * 0.55, -spriteH * 0.1);
          ctx.rotate(side * (0.7 + wave * 0.7));
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = col;
          ctx.fillRect(-scale * 0.5, -scale * 2.3, scale, scale * 4.6);
          ctx.globalAlpha = 1;
          ctx.fillRect(-scale * 0.2, -scale * 2, scale * 0.4, scale * 4);
          ctx.globalCompositeOperation = 'source-over';
          ctx.restore();
        });
      }
      ctx.restore();

      // Sweat flying off everyone in the 90s warehouse
      if (mode === 'house' && !reduced && bounce > scale * 0.8 && Math.random() < 0.25) {
        trail.push({
          kind: 'sweat',
          x: px + (Math.random() - 0.5) * spriteW * 0.8,
          y: py - spriteH * 0.3,
          vx: (Math.random() - 0.5) * 4, vy: -2 - Math.random() * 1.5,
          size: 2 + Math.random() * 2, life: 26 + Math.random() * 12,
          color: '#cfeaff',
        });
      }
    }

    // The hatchling, out for a joyride above the party
    if (eggStage === 'dragon' && !reduced && eggD) {
      const isChicken = hatchling.kind === 'chicken';
      const HW = hatchling.w, HH = hatchling.h;
      const t = Math.min(1, (now - dragonStart) / DRAGON_MS);
      const eggX = W * eggD.xFrac;
      const eggY = floorY - 6 * scale;
      const curve = tt => ({
        x: W * (0.5 + 0.36 * Math.sin(tt * Math.PI * 4 + 1.2)),
        y: H * (0.26 + 0.13 * Math.sin(tt * Math.PI * 6)),
      });
      // Ease out of the egg spot at the start, glide back home at the end
      const k = t < 0.12 ? t / 0.12 : t > 0.88 ? (1 - t) / 0.12 : 1;
      const ke = k * k * (3 - 2 * k);
      const c0 = curve(t), c1 = curve(t + 0.01);
      const dx = eggX + (c0.x - eggX) * ke;
      // Chickens are, famously, not great at this: frantic flapping, lurching altitude
      const panic = isChicken ? Math.sin(now / 70) * scale * 1.2 + Math.sin(now / 310) * scale * 2.5 : 0;
      const dy = eggY + (c0.y - eggY) * ke + panic * ke;
      const sx = c1.x >= c0.x ? -1 : 1;   // sprite faces left; flip when heading right
      const flap = FLAP_CYCLE[Math.floor(danceMs / (isChicken ? 60 : 110)) % FLAP_CYCLE.length];
      const bob = Math.sin(danceMs / 180) * scale * 0.4;

      // Sparkle trail off the tail (feathers for the chicken, gold dust for the golden)
      if (Math.random() < 0.6) {
        trail.push({
          x: dx - sx * HW * scale * 0.35, y: dy + bob,
          vx: (Math.random() - 0.5) * 0.6, vy: 0.3 + Math.random() * 0.4,
          size: 2 + Math.random() * 3, life: 40 + Math.random() * 25,
          color: (isChicken ? ['#fdf6ec', '#ffffff', '#f2a33c']
            : hatchling.kind === 'golden' ? ['#f2c14e', '#f9e2a0', '#fdf6ec', '#ffffff']
            : ['#f2c9dc', '#e08fb6', '#f2c14e', '#fdf6ec'])[Math.floor(Math.random() * 4)],
        });
      }
      // Disco chicken payload: it lays mid-air. The eggs are a hazard. The cat is thrilled.
      if (isChicken && Math.random() < 0.025 && trail.length < 400) {
        trail.push({
          kind: 'eggdrop',
          x: dx, y: dy + bob + HH * scale * 0.3,
          vx: (Math.random() - 0.5) * 1.2, vy: 0.5,
          size: Math.max(3, scale * 1.1), life: 400,
          color: '#fdf6ec',
        });
        if (Math.random() < 0.4) cluckSound();
      }
      // Fire breath: pick a dancer on the facing side and hose them down for ~700ms
      if (!isChicken && !flameJet && now - lastFlameAt > 2400 && t > 0.1 && t < 0.85) {
        lastFlameAt = now;
        const candidates = [], everyone = [];
        for (let j = 0; j < DANCERS.length; j++) {
          if (DANCERS[j].isEgg) continue;   // can't flame yourself
          everyone.push(j);
          const tx = W * DANCERS[j].xFrac;
          if (sx === 1 ? tx < dx : tx > dx) candidates.push(j);
        }
        const pool = candidates.length ? candidates : everyone;
        if (pool.length) {
          const ti = pool[Math.floor(Math.random() * pool.length)];
          flameJet = { ti, tx: W * DANCERS[ti].xFrac, ty: floorY - 2 * scale, until: now + 700 };
          duckUntil[ti] = now + 1700;   // they see it coming and hit the deck
        }
      }
      // Sustained cone of flame from the mouth while the jet is live
      if (flameJet && now <= flameJet.until) {
        const mouthX = dx - sx * HW * scale * 0.5;
        const mouthY = dy + bob - scale * 2;
        const dist = Math.hypot(flameJet.tx - mouthX, flameJet.ty - mouthY) || 1;
        const steps = 26;
        const baseAng = Math.atan2(flameJet.ty - mouthY, flameJet.tx - mouthX);
        for (let i = 0; i < 9; i++) {
          const ang = baseAng + (Math.random() - 0.5) * 0.28;
          const sp = (dist / steps) * (0.65 + Math.random() * 0.7);
          const life = steps * (0.8 + Math.random() * 0.5);
          trail.push({
            kind: 'fire',
            x: mouthX + (Math.random() - 0.5) * scale, y: mouthY + (Math.random() - 0.5) * scale,
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
            size: scale * (0.7 + Math.random() * 0.8),
            life, total: life,
          });
        }
      }

      // Faint shadow far below on the grass
      ctx.fillStyle = `rgba(${T.shadow}, 0.15)`;
      ctx.beginPath();
      ctx.ellipse(dx, floorY + scale * 0.4, scale * HW * 0.21, scale * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(dx, dy + bob);
      ctx.scale(sx, 1);
      ctx.rotate(Math.sin(now / 300) * 0.05);
      ctx.drawImage(hatchling.frames[flap], -HW * scale / 2, -HH * scale / 2, HW * scale, HH * scale);
      ctx.restore();
      dragonPos = { x: dx, y: dy + bob };
    } else {
      dragonPos = null;
    }

    // Jet finished (or dragon left) — impact: flash ring + ember splash where it landed
    if (flameJet && now > flameJet.until) {
      flash = { x: flameJet.tx, y: flameJet.ty, start: now, dur: 450 };
      for (let i = 0; i < 18; i++) {
        trail.push({
          kind: 'ember',
          x: flameJet.tx + (Math.random() - 0.5) * scale * 4, y: flameJet.ty,
          vx: (Math.random() - 0.5) * 3.5, vy: -1 - Math.random() * 2.5,
          size: 2 + Math.random() * 3, life: 35 + Math.random() * 25,
          color: ['#f2c14e', '#e8907a', '#9a8478'][i % 3],
        });
      }
      flameJet = null;
    }

    // Dragon trail, fire, and embers
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i];
      p.x += p.vx; p.y += p.vy;
      if (p.kind === 'ember' || p.kind === 'sweat') p.vy += 0.1;
      if (p.kind === 'eggdrop') {
        p.vy += 0.22;
        if (p.y >= H * 0.72) {   // splat
          burst(p.x, H * 0.72, ['#fdf6ec', '#ffffff', '#f2c14e'], 8);
          trail.splice(i, 1); continue;
        }
      }
      p.life--;
      if (p.life <= 0) { trail.splice(i, 1); continue; }
      if (p.kind === 'fire') {
        // Additive glow, white-hot at birth cooling to deep red, swelling as it flies
        const f = p.life / p.total;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(1, f + 0.25);
        ctx.fillStyle = f > 0.72 ? '#fff8dc' : f > 0.5 ? '#ffd24e' : f > 0.3 ? '#ff8c4a' : '#e0483a';
        const s = p.size * (1.6 - f);
        ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        ctx.globalAlpha = Math.min(1, p.life / 25);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }
    ctx.globalAlpha = 1;

    // Impact flash — expanding hot ring that fades
    if (flash) {
      const fp = (now - flash.start) / flash.dur;
      if (fp >= 1) flash = null;
      else {
        const r = scale * 2 + fp * scale * 9;
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(flash.x, flash.y, 0, flash.x, flash.y, r);
        g.addColorStop(0, `rgba(255, 244, 200, ${0.55 * (1 - fp)})`);
        g.addColorStop(0.6, `rgba(255, 140, 74, ${0.35 * (1 - fp)})`);
        g.addColorStop(1, 'rgba(224, 72, 58, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(flash.x, flash.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // Steam
    for (let i = steam.length - 1; i >= 0; i--) {
      const p = steam[i];
      p.y += p.vy;
      p.x += 0.25;
      p.r += 0.14;
      p.life--;
      if (p.life <= 0) { steam.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(0.85, p.life / 50);
      ctx.fillStyle = '#fdf6ec';
      ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      ctx.globalAlpha = 1;
    }

    // Confetti
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.x += p.vx + tiltX * 1.4; p.y += p.vy;
      p.vy += 0.18;
      p.life--;
      if (p.life <= 0 || p.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Rhythm judge: combo counter top-right, popping on each hit
    if (beatOn && !reduced && (combo >= 2 || now - comboFlashAt < 700)) {
      const sinceFlash = now - comboFlashAt;
      const pop = Math.max(0, 1 - sinceFlash / 220);
      const fs = Math.max(15, Math.round(Math.min(W, H) * 0.035)) * (1 + pop * 0.35);
      ctx.save();
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.font = '700 ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
      const hx = W - Math.max(16, W * 0.03), hy = Math.max(52, H * 0.09);
      if (combo >= 2) {
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillText(combo + 'x combo', hx + 2, hy + 2);
        ctx.fillStyle = combo >= 8 ? '#f2c14e' : '#fdf6ec';
        ctx.fillText(combo + 'x combo', hx, hy);
      }
      if (sinceFlash < 700 && comboJudge) {
        ctx.globalAlpha = 1 - sinceFlash / 700;
        ctx.font = '600 ' + Math.round(fs * 0.6) + 'px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillStyle = comboJudge === 'miss' ? '#d95763' : comboJudge === 'perfect' ? '#f2c14e' : '#fdf6ec';
        ctx.fillText(comboJudge, hx, hy + fs * 1.15);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
  }

  if (reduced) {
    drawScene(0);
    setInterval(() => { if (confetti.length) drawScene(performance.now()); }, 40);
  } else {
    const loop = now => {
      // The dance clock runs double-speed in house mode, half-speed in trap
      if (lastFrameNow !== null) danceMs += Math.min(100, now - lastFrameNow) * danceRate();
      lastFrameNow = now;
      drawScene(now);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
